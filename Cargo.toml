[workspace]
resolver = "3"
members = ["crates/arena-sim", "crates/arena-headless", "crates/arena-client"]
default-members = ["crates/arena-sim", "crates/arena-headless"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.web]
inherits = "release"
opt-level = "s"
lto = "thin"
strip = "debuginfo"
