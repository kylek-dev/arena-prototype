[package]
name = "arena-bot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bot players and load tester for the match server, with simulated latency and jitter."

[dependencies]
arena-protocol = { path = "../arena-protocol" }
arena-sim = { path = "../arena-sim" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "=0.29.0"
futures-util = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
arena-server = { path = "../arena-server" }
# Paused virtual time for deterministic delay-line tests.
tokio = { version = "=1.54.1", features = ["test-util"] }

[lints]
workspace = true
