[package]
name = "arena-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Versioned match wire messages: postcard binary frames, bounded decoding and a JSON debug dump. No I/O."

[dependencies]
arena-sim = { path = "../arena-sim" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
postcard = { version = "=1.2.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
arena-map = { path = "../arena-map" }

[lints]
workspace = true
