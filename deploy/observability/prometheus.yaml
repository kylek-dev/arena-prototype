# Prometheus inside grafana/otel-lgtm (ADR 0054), mounted over the image's
# /otel-lgtm/prometheus.yaml. Grafana Alloy on the game host scrapes the
# arena services and remote-writes here (deploy/observability/alloy.alloy),
# so this Prometheus scrapes nothing itself; this file keeps the image's OTLP
# settings. Retention is a flag: PROMETHEUS_EXTRA_ARGS in deploy/compose.yaml.
global:
  scrape_interval: 15s
  scrape_timeout: 5s
  scrape_native_histograms: true

otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - deployment.environment.name

storage:
  tsdb:
    out_of_order_time_window: 10m

