name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    # The world server's Axum/Tokio stack makes cold-cache builds slower.
    timeout-minutes: 20
    # Account tests run against PostgreSQL (ADR 0055).
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_PASSWORD: arena-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      ARENA_TEST_DATABASE_URL: postgres://postgres:arena-ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: unit
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint rules, protocol, world server, bots and headless runner (no renderer)
        run: cargo clippy -p arena-sim -p arena-protocol -p arena-world -p arena-bot -p arena-headless --all-targets --locked -- -D warnings
      - name: Test rules, protocol, world server, bots and headless runner
        run: cargo test -p arena-sim -p arena-protocol -p arena-world -p arena-bot -p arena-headless --locked
      - name: Run headless scenario
        run: cargo run --locked -p arena-headless
      - name: Build world server and bot binaries
        run: cargo build --locked -p arena-world -p arena-bot
      - name: Smoke test server and bots over WebSockets with latency and rejoins
        run: bash scripts/server-smoke.sh debug
  # Keep the required check name; test browser input without compiling Bevy.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check web/input.js
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Test browser input (no browser or WASM build)
        run: npm test
      - run: npm run build
