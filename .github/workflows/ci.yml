name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
      - name: Verify
        run: bash scripts/check.sh
      - name: Run headless scenario
        run: cargo run --locked -p arena-headless
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned Rust toolchain and WASM target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-0.2.122-${{ runner.os }}
      - name: Install pinned WASM bindings CLI
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -qx 'wasm-bindgen 0.2.122'; then
            cargo install wasm-bindgen-cli --version 0.2.122 --locked
          fi
      - name: Check browser-specific Rust bridge
        run: cargo clippy -p arena-client --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build browser client
        run: ./scripts/build-web.sh
      - name: Install browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test browser interactions
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: browser-build
          path: web/
