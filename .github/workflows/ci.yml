name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: unit
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint rules and headless runner (no renderer)
        run: cargo clippy -p arena-sim -p arena-headless --all-targets --locked -- -D warnings
      - name: Test rules and headless runner
        run: cargo test -p arena-sim -p arena-headless --locked
      - name: Run headless scenario
        run: cargo run --locked -p arena-headless
  # Keep the required check name; test browser input without compiling Bevy.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check web/shell.js
          node --check web/input.js
      - name: Test browser input (no browser or WASM build)
        run: npm test
