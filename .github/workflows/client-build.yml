name: Full client build
on:
  # Keep these filters in sync. Shared Rust rules also affect the client.
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'rust-toolchain*'
      - '.cargo/**'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'crates/**'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'rust-toolchain*'
      - '.cargo/**'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: native
      - name: Verify entire workspace including client
        run: bash scripts/check.sh
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and WASM target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: wasm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-0.2.122-${{ runner.os }}
      - name: Install pinned WASM bindings CLI
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -qx 'wasm-bindgen 0.2.122'; then
            cargo install wasm-bindgen-cli --version 0.2.122 --locked
          fi
      - name: Check browser-specific Rust bridge
        run: cargo clippy -p arena-client --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build browser client
        run: ./scripts/build-web.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-build
          path: web/
