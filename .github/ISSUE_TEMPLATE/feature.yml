name: Feature or design decision
description: Propose a bounded change with a testable outcome
title: "[Proposal] "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Player or developer outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and verification
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Dependencies, alternatives, and open questions
